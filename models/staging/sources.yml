version: 2

sources:
  - name: tpch
    description: TPCH サンプルデータの raw スキーマ。
    database: raw
    schema: tpch_sf001
    tables:
      - name: orders
        description: 注文単位の明細を保持するテーブル。
        columns:
          - name: o_orderkey
            description: 注文キー。
          - name: o_custkey
            description: 顧客キー。
          - name: o_orderstatus
            description: 注文ステータスコード。
          - name: o_totalprice
            description: 注文合計金額。
          - name: o_orderdate
            description: 注文日。
          - name: o_orderpriority
            description: 注文優先度。
          - name: o_clerk
            description: 担当者名。
          - name: o_shippriority
            description: 出荷優先度。
          - name: o_comment
            description: 注文コメント。
      - name: customer
        description: 顧客単位のマスターテーブル。
        columns:
          - name: c_custkey
            description: 顧客キー。
          - name: c_name
            description: 顧客名。
          - name: c_address
            description: 顧客住所。
          - name: c_nationkey
            description: 国キー。
          - name: c_phone
            description: 電話番号。
          - name: c_acctbal
            description: 口座残高。
          - name: c_mktsegment
            description: 市場セグメント。
          - name: c_comment
            description: 顧客コメント。
      - name: lineitem
        description: 注文内の商品明細を保持するテーブル。
        columns:
          - name: l_orderkey
            description: 注文キー。
          - name: l_partkey
            description: 部品キー。
          - name: l_suppkey
            description: 仕入先キー。
          - name: l_linenumber
            description: 注文明細行番号。
          - name: l_quantity
            description: 数量。
          - name: l_extendedprice
            description: 明細金額。
          - name: l_discount
            description: 割引率。
          - name: l_tax
            description: 税率。
          - name: l_returnflag
            description: 返品フラグ。
          - name: l_linestatus
            description: 明細ステータスコード。
          - name: l_shipdate
            description: 出荷日。
          - name: l_commitdate
            description: 確約日。
          - name: l_receiptdate
            description: 受領日。
          - name: l_shipinstruct
            description: 出荷指示。
          - name: l_shipmode
            description: 出荷方法。
          - name: l_comment
            description: 明細コメント。
      - name: nation
        description: 国マスターテーブル。
        columns:
          - name: n_nationkey
            description: 国キー。
          - name: n_name
            description: 国名。
          - name: n_regionkey
            description: 地域キー。
          - name: n_comment
            description: 国コメント。
      - name: part
        description: 部品マスターテーブル。
        columns:
          - name: p_partkey
            description: 部品キー。
          - name: p_name
            description: 部品名。
          - name: p_mfgr
            description: 製造元。
          - name: p_brand
            description: ブランド。
          - name: p_type
            description: 部品タイプ。
          - name: p_size
            description: サイズ。
          - name: p_container
            description: 容器種別。
          - name: p_retailprice
            description: 小売価格。
