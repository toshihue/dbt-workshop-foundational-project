        description: 更新日付きの部品テーブル。
        columns:
          - name: p_partkey
            description: 部品キー。
          - name: p_name
            description: 部品名。
          - name: p_mfgr
            description: 製造元。
          - name: p_brand
            description: ブランド。
          - name: p_type
            description: 部品タイプ。
          - name: p_size
            description: サイズ。
